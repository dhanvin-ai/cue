[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "firebase-admin>=6,<8",
  "google-cloud-pubsub>=2,<3",
  "google-cloud-secret-manager>=2,<3",
  "google-cloud-storage>=2,<4",
  "google-cloud-tasks>=2,<3",
  "httpx>=0.27,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-sdk>=1.28,<2",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "httpx2>=2,<3", "playwright>=1.56,<2", "pytest>=8,<10"]
demo = ["anthropic>=2.3,<3", "faster-whisper>=1.1,<2", "kokoro-onnx>=0.4,<1", "numpy>=2,<3", "playwright>=1.56,<2", "websockets>=13,<16"]

[tool.setuptools.packages.find]
include = ["cue*"]
