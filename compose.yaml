services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cue
      POSTGRES_USER: cue_admin
      POSTGRES_PASSWORD: cue_local_admin
    ports:
      - "5433:5432"
    volumes:
      - cue_postgres:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
    volumes:
      - cue_qdrant:/qdrant/storage
  # Local stand-ins for GCP. Set PUBSUB_EMULATOR_HOST and STORAGE_EMULATOR_HOST to use them.
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=cue-local
    ports:
      - "8085:8085"
  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    command: -scheme http -port 4443 -public-host localhost:4443
    ports:
      - "4443:4443"

volumes:
  cue_postgres:
  cue_qdrant:
