services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cue
      POSTGRES_USER: cue_admin
      POSTGRES_PASSWORD: cue_local_admin
    ports:
      - "5433:5432"
    volumes:
      - cue_postgres:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
    volumes:
      - cue_qdrant:/qdrant/storage

volumes:
  cue_postgres:
  cue_qdrant:
